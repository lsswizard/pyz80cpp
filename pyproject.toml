[build-system]
requires = ["scikit-build-core>=0.8", "nanobind"]
build-backend = "scikit_build_core.build"

[project]
name = "PyZ80"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = ["nanobind"]

[tool.scikit-build]
cmake.source-dir = "."

[tool.scikit-build.cmake.define]
ENABLE_NANOBIND = "ON"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv"]
python_files = ["test_*.py"]