[build-system]
requires = ["setuptools>=68", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "z80_core"
version = "2.7.1"
description = "Machine-independent cycle-accurate Z80 CPU core with Python bindings"
requires-python = ">=3.12"

[tool.setuptools]
packages = []

[tool.setuptools.package-data]
z80_core = ["*.so", "*.pyd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv"]
python_files = ["test_*.py"]